spring.application.name=saferide-api
server.address=${API_BIND_ADDRESS:127.0.0.1}
server.port=${API_PORT:8080}
spring.flyway.locations=classpath:db/migration
server.error.include-message=never
server.error.include-stacktrace=never
saferide.tomtom.api-key=${SAFERIDE_TOMTOM_API_KEY:}

# Keep public-data imports independent from news collection.
spring.task.scheduling.pool.size=2
saferide.public-data.refresh-ms=21600000
